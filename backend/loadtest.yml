# Prueba de carga — API Control Vehicular (backend LOCAL, BD Aiven real)
#
# Uso:
#   $env:TOKEN = node scripts/gen-test-token.js
#   npx artillery run loadtest.yml --output loadtest-report.json
#   npx artillery report loadtest-report.json   (genera HTML)
#
# Fase 1 (health): sin BD, mide el límite del servidor Express + rate limit.
# Fase 2 (dashboard): 8 queries por petición contra Aiven — mide el límite real
#   del pool MySQL + índices. Ajusta "arrivalRate"/"phases" si tu plan difiere.
config:
  target: "http://localhost:3001"
  phases:
    - name: "health - 100 usuarios simultaneos"
      duration: 60
      arrivalRate: 100
      rampTo: 150
    - name: "dashboard - 20 usuarios autenticados"
      duration: 45
      arrivalRate: 10
      rampTo: 20
  ensure:
    thresholds:
      - "http.response_time.p95": 400
      - "http.codes.429": 50          # el rate limit puede rechazar VUs nuevas
scenarios:
  - name: "health check"
    flow:
      - get:
          url: "/api/health"
          timeout: 5000
  - name: "dashboard autenticado"
    flow:
      - get:
          url: "/api/reportes/dashboard"
          headers:
            Authorization: "Bearer {{ $processEnvironment.TOKEN }}"
          timeout: 8000